# Lightweight deterministic preflight for customer-facing commercial pages.
# This is a release hygiene check, not certification or payment verification.
name: Commercial page quality gate
on:
  pull_request:
    paths:
      - "index.html"
      - "app.html"
      - "gradercheck/**"
      - "free/**"
      - "gta6-creator/**"
      - ".github/scripts/commercial_quality_gate.py"
      - ".github/workflows/commercial-quality.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.html"
      - "gradercheck/**"
      - "free/**"
      - "gta6-creator/**"
      - ".github/scripts/commercial_quality_gate.py"
      - ".github/workflows/commercial-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: Commercial page preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required customer pages and buyer paths
        run: python .github/scripts/commercial_quality_gate.py
