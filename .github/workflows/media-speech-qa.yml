name: Arabic speech QA - existing audio acceptance
on:
  push:
    paths:
      - '.github/workflows/media-speech-qa.yml'
  workflow_run:
    workflows: ['Nabra Arabic TTS - free runner smoke test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing Nabra artifact run ID
        required: true
        default: '45864527595'
permissions:
  contents: read
  actions: read
concurrency:
  group: media-speech-qa
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Nabra-TTS-Arabic-probe
          run-id: ${{ github.event.workflow_run.id || inputs.source_run || '45864527595' }}
          github-token: ${{ github.token }}
          path: candidate_audio
      - name: Install bounded CPU ASR
        run: |
          python -m venv "$RUNNER_TEMP/asr_build"
          "$RUNNER_TEMP/asr_build/bin/python" -m pip install 'faster-whisper==1.2.1' 'huggingface_hub==0.36.0'
          "$RUNNER_TEMP/asr_build/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small',revision='536b0662742c02347bc0e980a01041f333bce120',local_dir='asr_model')"
      - name: Analyze actual six existing WAV files
        run: |
          "$RUNNER_TEMP/asr_build/bin/python" tools/media_release/speech_qa.py --audio-dir candidate_audio --references tools/media_release/nabra_probe_references.json --model-dir asr_model --out speech-qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-speech-qa-evidence
          path: speech-qa.json
          if-no-files-found: error
          retention-days: 7
      - name: Build offline runtime only on explicit workflow installation change
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p offline_asr/wheels offline_asr/model
          cp -a asr_model/. offline_asr/model/
          rm -rf offline_asr/model/.cache
          "$RUNNER_TEMP/asr_build/bin/python" -m pip freeze --exclude pip --exclude setuptools --exclude wheel > offline_asr/requirements.lock
          "$RUNNER_TEMP/asr_build/bin/python" -m pip download --only-binary=:all: -r offline_asr/requirements.lock -d offline_asr/wheels
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('offline_asr')
          files={}
          for f in p.rglob('*'):
              if f.is_file():
                  with f.open('rb') as h: files[str(f.relative_to(p))]=hashlib.file_digest(h,'sha256').hexdigest()
          (p/'SHA256SUMS.json').write_text(json.dumps(files,indent=2))
          if sum(f.stat().st_size for f in p.rglob('*') if f.is_file())>800*1024*1024:
              raise SystemExit('HOLD: offline bundle exceeds bounded 800 MiB transfer budget')
          PY
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python tools/media_release/install_offline_asr.py offline_asr "${RUNNER_TEMP}/asr_verified"
          HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 "${RUNNER_TEMP}/asr_verified/bin/python" tools/media_release/speech_qa.py --audio-dir candidate_audio --references tools/media_release/nabra_probe_references.json --model-dir offline_asr/model --out offline-speech-qa.json
      - name: Preserve bounded offline model and runtime bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ASR-offline-linux-x86_64-py313
          path: |
            offline_asr/
            offline-speech-qa.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
