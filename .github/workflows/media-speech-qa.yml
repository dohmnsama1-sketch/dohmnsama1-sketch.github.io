name: Arabic speech QA - existing audio acceptance
on:
  push:
    paths:
      - '.github/workflows/media-speech-qa.yml'
      - 'tools/media_release/speech_qa.py'
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing Nabra artifact run ID
        required: true
        default: '45864527595'
permissions:
  contents: read
  actions: read
concurrency:
  group: media-speech-qa
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: Nabra-TTS-Arabic-probe
          run-id: ${{ inputs.source_run || '45864527595' }}
          github-token: ${{ github.token }}
          path: candidate_audio
      - name: Install bounded CPU ASR
        run: |
          python -m pip install 'faster-whisper==1.2.1' 'huggingface_hub==0.36.0'
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small',revision='536b066',local_dir='asr_model')"
      - name: Analyze actual six existing WAV files
        run: |
          python tools/media_release/speech_qa.py --audio-dir candidate_audio --references tools/media_release/nabra_probe_references.json --model-dir asr_model --out speech-qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-speech-qa-evidence
          path: speech-qa.json
          if-no-files-found: error
          retention-days: 7
