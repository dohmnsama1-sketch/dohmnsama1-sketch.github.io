name: RiskLab regression tests
on:
  push:
    paths:
      - 'risklab/**'
      - '.github/workflows/risklab-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test risklab/*.test.cjs risklab/mt5/*.test.cjs
