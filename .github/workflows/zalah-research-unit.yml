name: ZALAH research unit tests
on:
  push:
    paths:
      - 'risklab/mt5/research/*.py'
      - '.github/workflows/zalah-research-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test broker quote integrity, fill conservatism, fee accounting, holdout gate
        run: python -m unittest discover -s risklab/mt5/research -p 'test_*.py' -v
