<script>/* Meezan engine — dependency-free. Runs in browsers and Node 20+.
   Parses Salla/Zid/Shopify-style order exports (CSV/XLSX), maps columns, computes true net profit. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MeezanEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- text helpers ----------
  const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩', FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
  function latinDigits(s) {
    return String(s).replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d));
  }
  function norm(s) {
    if (s === null || s === undefined) return '';
    return latinDigits(String(s)).toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[^a-z0-9\u0621-\u064A]+/g, ' ').trim().replace(/\s+/g, ' ');
  }
  function parseMoney(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    let s = latinDigits(String(v)).replace(/[\u200e\u200f\u00a0]/g, ' ').trim();
    if (!s) return null;
    s = s.replace(/٫/g, '.').replace(/٬/g, ',');
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s);
    s = s.replace(/[^0-9.,]/g, '');
    if (!s) return null;
    const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    } else if (lastComma > -1) {
      // "1,234" -> thousands ; "12,5" -> decimal
      s = /,\d{3}(,|$)/.test(s) && (s.match(/,/g).length > 1 || s.length - lastComma - 1 === 3) ? s.replace(/,/g, '') : s.replace(',', '.');
    }
    const n = parseFloat(s);
    if (!isFinite(n)) return null;
    return neg ? -Math.abs(n) : n;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseDate(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
      return null;
    }
    const s = latinDigits(String(v)).trim();
    let m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]); // dd/mm/yyyy (Saudi convention)
    return null;
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    const cands = [',', ';', '\t'];
    let delim = ',', best = -1;
    for (const d of cands) { const c = firstLine.split(d).length; if (c > best) { best = c; delim = d; } }
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = ''; if (row.some(c => c !== '')) rows.push(row); row = [];
      } else cur += ch;
    }
    row.push(cur); if (row.some(c => c !== '')) rows.push(row);
    return rows;
  }

  // ---------- XLSX (zip + xml, no dependencies) ----------
  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('DecompressionStream unsupported — use a current Chrome/Edge/Safari/Firefox');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Not a valid .xlsx file');
    const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
    const files = {}; const dec = new TextDecoder('utf-8');
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true); const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
      files[name] = { method, csize, off }; p += 46 + nlen + elen + clen;
    }
    return {
      names: Object.keys(files),
      async read(name) {
        const f = files[name]; if (!f) return null;
        const lnl = dv.getUint16(f.off + 26, true), lel = dv.getUint16(f.off + 28, true);
        const start = f.off + 30 + lnl + lel; const data = u8.subarray(start, start + f.csize);
        const out = f.method === 0 ? data : await inflateRaw(data);
        return new TextDecoder('utf-8').decode(out);
      }
    };
  }
  function xmlUnescape(s) {
    return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
      .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');
  }
  function colIndex(ref) { const m = ref.match(/^([A-Z]+)/); let n = 0; for (const c of m[1]) n = n * 26 + (c.charCodeAt(0) - 64); return n - 1; }
  async function parseXLSX(buf) {
    const z = await unzip(buf);
    const wb = await z.read('xl/workbook.xml'); const rels = await z.read('xl/_rels/workbook.xml.rels');
    let sheetPath = null;
    if (wb && rels) {
      const sm = wb.match(/<sheet\b[^>]*r:id="([^"]+)"/);
      if (sm) { const rm = new RegExp('<Relationship\\b[^>]*Id="' + sm[1] + '"[^>]*>').exec(rels) || null;
        if (rm) { const t = rm[0].match(/Target="([^"]+)"/); if (t) sheetPath = t[1].replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/'); } }
    }
    if (!sheetPath || !z.names.includes(sheetPath)) sheetPath = z.names.filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
    if (!sheetPath) throw new Error('No worksheet found');
    const ssXml = await z.read('xl/sharedStrings.xml'); const strings = [];
    if (ssXml) { const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g; let m;
      while ((m = re.exec(ssXml))) { let t = ''; const tr = /<t\b[^>]*>([\s\S]*?)<\/t>/g; let x; while ((x = tr.exec(m[1]))) t += x[1]; strings.push(xmlUnescape(t)); } }
    const sheet = await z.read(sheetPath); const rows = [];
    const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g; let rm;
    while ((rm = rowRe.exec(sheet))) {
      const row = []; const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
      while ((cm = cellRe.exec(rm[1]))) {
        const attrs = cm[1], inner = cm[2] || ''; const ref = (attrs.match(/\br="([A-Z]+\d+)"/) || [])[1]; if (!ref) continue;
        const t = (attrs.match(/\bt="([^"]+)"/) || [])[1]; let val = null;
        const v = inner.match(/<v>([\s\S]*?)<\/v>/);
        if (t === 's' && v) val = strings[+v[1]];
        else if (t === 'inlineStr') { let s = ''; const tr = /<t\b[^>]*>([\s\S]*?)<\/t>/g; let x; while ((x = tr.exec(inner))) s += x[1]; val = xmlUnescape(s); }
        else if (t === 'str' && v) val = xmlUnescape(v[1]);
        else if (t === 'b' && v) val = v[1] === '1';
        else if (v) { const n = parseFloat(v[1]); val = isFinite(n) ? n : xmlUnescape(v[1]); }
        row[colIndex(ref)] = val === undefined ? null : val;
      }
      for (let i = 0; i < row.length; i++) if (row[i] === undefined) row[i] = null;
      if (row.some(c => c !== null && c !== '')) rows.push(row);
    }
    return rows;
  }

  // ---------- table + mapping ----------
  function toTable(rawRows) {
    // header row = first row with >=3 non-empty text cells
    let h = 0;
    for (let i = 0; i < Math.min(rawRows.length, 10); i++) { if (rawRows[i].filter(c => typeof c === 'string' && c.trim() !== '' && parseMoney(c) === null).length >= 3) { h = i; break; } }
    const headers = (rawRows[h] || []).map(x => (x === null || x === undefined) ? '' : String(x).trim());
    const rows = rawRows.slice(h + 1).map(r => { const o = []; for (let i = 0; i < headers.length; i++) o.push(r[i] === undefined ? null : r[i]); return o; });
    return { headers, rows };
  }
  const SYN = {
    order_id: ['رقم الطلب', 'رقم الطلبيه', 'order id', 'order number', 'order no', 'order', 'name', 'رقم المرجع', 'reference', 'id', 'رقم'],
    date: ['تاريخ الطلب', 'تاريخ الانشاء', 'تاريخ', 'order date', 'created at', 'date created', 'date', 'created'],
    status: ['حاله الطلب', 'الحاله', 'status', 'order status', 'financial status', 'fulfillment status'],
    payment: ['طريقه الدفع', 'وسيله الدفع', 'بوابه الدفع', 'payment method', 'payment gateway', 'gateway', 'payment', 'الدفع'],
    carrier: ['شركه الشحن', 'شركه التوصيل', 'carrier', 'shipping company', 'courier', 'shipping provider', 'طريقه الشحن', 'shipping method', 'shipping line title'],
    shipping_fee: ['تكلفه الشحن', 'رسوم الشحن', 'سعر الشحن', 'shipping cost', 'shipping fee', 'shipping fees', 'shipping price', 'shipping', 'الشحن', 'شحن'],
    cod_fee: ['رسوم الدفع عند الاستلام', 'تكلفه الدفع عند الاستلام', 'cod fee', 'cod fees', 'cod charge'],
    discount: ['قيمه الخصم', 'اجمالي الخصم', 'الخصم', 'خصم', 'كوبون', 'discount amount', 'total discount', 'discount', 'coupon'],
    subtotal: ['المجموع الفرعي', 'اجمالي المنتجات', 'subtotal', 'sub total', 'items total'],
    total: ['اجمالي الطلب', 'المبلغ الاجمالي', 'المجموع الكلي', 'الاجمالي', 'اجمالي المبلغ', 'المجموع', 'order total', 'grand total', 'total amount', 'total', 'amount'],
    product: ['اسم المنتج', 'المنتج', 'product name', 'lineitem name', 'item name', 'product', 'item', 'title'],
    sku: ['رمز المنتج', 'sku', 'lineitem sku', 'رمز sku', 'باركود', 'barcode'],
    qty: ['الكميه', 'كميه', 'quantity', 'lineitem quantity', 'qty'],
    unit_price: ['سعر الوحده', 'سعر المنتج', 'السعر', 'unit price', 'lineitem price', 'price'],
    line_total: ['اجمالي المنتج', 'مجموع المنتج', 'line total', 'item total']
  };
  const FIELD_ORDER = Object.keys(SYN);
  function autoMap(headers) {
    const nh = headers.map(norm); const cand = [];
    for (const f of FIELD_ORDER) SYN[f].forEach((s, i) => {
      const ns = norm(s);
      nh.forEach((h, c) => {
        if (!h) return; let sc = 0;
        if (h === ns) sc = 200 - i; else if ((' ' + h + ' ').includes(' ' + ns + ' ') && ns.length >= 3) sc = 100 - i - Math.abs(h.length - ns.length) * 0.5;
        else if (ns.includes(h) && h.length >= 4) sc = 20 - i * 0.1;
        if (sc > 0) cand.push({ f, c, sc });
      });
    });
    cand.sort((a, b) => b.sc - a.sc);
    const mapping = {}; const usedC = new Set();
    for (const k of cand) { if (mapping[k.f] !== undefined || usedC.has(k.c)) continue; mapping[k.f] = k.c; usedC.add(k.c); }
    for (const f of FIELD_ORDER) if (mapping[f] === undefined) mapping[f] = -1;
    return mapping;

let lang=(localStorage.getItem('mz_lang')||((navigator.language||'ar').startsWith('en')?'en':'ar'));
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
const M=m=>T[lang]['m_'+m]||m;
const fmt=(n,d=2)=>Number(n).toLocaleString(lang==='ar'?'en-US':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cur=n=>'<bdi dir="ltr">'+(n<0?'\u2212':'')+fmt(Math.abs(n),0)+' '+(lang==='ar'?'ر.س':'SAR')+'</bdi>';
let state={table:null,mapping:null,settings:E.defaultSettings(),costs:{},demo:false,result:null};
function save(){try{localStorage.setItem('mz_settings',JSON.stringify({s:state.settings,c:state.costs}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem('mz_settings')||'null');if(j){Object.assign(state.settings,j.s);state.costs=j.c||{}}}catch(e){}}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('langBtn').textContent=lang==='ar'?'EN':'عربي';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(typeof v==='string')el.textContent=v});
  document.querySelectorAll('[data-iph]').forEach(el=>el.placeholder=t(el.dataset.iph));
  $('modeBadge').textContent=PRO?'PRO':(lang==='ar'?'مجاني':'FREE');$('modeBadge').className='badge '+(PRO?'b-pro':'b-free');
  $('buyBtn').href=BUY_URL; if(state.table)buildSettings(); if(state.result)render();
}
// ---- file handling
async function handleFile(f){
  $('fileMsg').textContent='';
  try{
    let raw; if(/\.xlsx$/i.test(f.name)) raw=await E.parseXLSX(new Uint8Array(await f.arrayBuffer())); else raw=E.parseCSV(await f.text());
    useRaw(raw,false);
  }catch(e){$('fileMsg').innerHTML='<span class="neg-t">'+t('err_file')+'</span>';console.error(e)}
}
function useRaw(raw,demo){
  const table=E.toTable(raw); if(!table.headers.length||!table.rows.length)throw new Error('empty');
  state.table=table;state.mapping=E.autoMap(table.headers);state.demo=demo;
  $('fileMsg').textContent=t('loaded')(table.rows.length,table.headers.length);
  buildMap();buildSettings();$('stepSettings').classList.remove('hidden');$('report').classList.add('hidden');
  if(demo){applyDemoSettings()}
  $('stepSettings').scrollIntoView({behavior:'smooth'});
}
function buildMap(){
  const g=$('mapGrid');g.innerHTML='';
  E.FIELD_ORDER.forEach(f=>{const d=document.createElement('div');d.innerHTML='<label class="f">'+t('mapOf')[f]+'</label>';
    const s=document.createElement('select');s.innerHTML='<option value="-1">'+t('none')+'</option>'+state.table.headers.map((h,i)=>`<option value="${i}">${esc(h||('#'+(i+1)))}</option>`).join('');
    s.value=state.mapping[f];s.onchange=()=>{state.mapping[f]=+s.value;buildSettings()};d.appendChild(s);g.appendChild(d)});
  $('mapBox').classList.remove('hidden');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function preScan(){ // detect carriers/products with default settings (no cap)
  const s=Object.assign(E.defaultSettings(),{maxOrders:null});return E.analyze(state.table,state.mapping,s,{});
}
function buildSettings(){
  const S=state.settings;
  ['codFeeCost','packagingPerOrder','defaultShippingCost','adSpend','fixedMonthly','returnShipFactor'].forEach(k=>{$(k).value=S[k]||0;$(k).onchange=()=>{S[k]=+$(k).value||0;save()}});
  $('defaultCostPct').value=Math.round((S.defaultCostPct||0)*100);$('defaultCostPct').onchange=()=>{S.defaultCostPct=(+$('defaultCostPct').value||0)/100;save()};
  $('vatMode').value=S.vatMode;$('vatMode').onchange=()=>{S.vatMode=$('vatMode').value;save()};
  const ft=$('feeTable');ft.innerHTML='<tr><th>'+t('th_method')+'</th><th>%</th><th>SAR</th><th></th></tr>';
  E.METHODS.forEach(m=>{const r=S.feeRules[m];const tr=document.createElement('tr');
    tr.innerHTML=`<td>${M(m)}</td><td><input type="number" step="0.05" min="0" value="${r.pct}" data-m="${m}" data-k="pct"></td><td><input type="number" step="0.25" min="0" value="${r.fixed}" data-m="${m}" data-k="fixed"></td><td>${r.assumed?'<span class="chip">'+t('est')+'</span>':''}</td>`;ft.appendChild(tr)});
  ft.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.feeRules[i.dataset.m][i.dataset.k]=+i.value||0;S.feeRules[i.dataset.m].assumed=false;save()});
  const scan=state.table?preScan():{carriers:[],products:[]};
  const cg=$('carrierGrid');cg.innerHTML='';
  scan.carriers.forEach(c=>{const k=E.norm(c);const d=document.createElement('div');d.innerHTML=`<label class="f">${esc(c)}</label><input type="number" min="0" step="0.5" value="${S.carrierCosts[k]||0}">`;
    d.querySelector('input').onchange=e=>{S.carrierCosts[k]=+e.target.value||0;save()};cg.appendChild(d)});
  $('carrierBox').classList.toggle('hidden',!scan.carriers.length);
  const pg=$('costGrid');pg.innerHTML='';const prods=scan.products.slice(0,60);
  prods.forEach(p=>{const d=document.createElement('div');const key=p;d.innerHTML=`<label class="f" title="${esc(p)}">${esc(p.length>34?p.slice(0,34)+'…':p)}</label><input type="number" min="0" step="0.5" value="${state.costs[key]||''}" placeholder="0">`;
    d.querySelector('input').onchange=e=>{if(e.target.value==='')delete state.costs[key];else state.costs[key]=+e.target.value;save()};pg.appendChild(d)});
  if(scan.products.length>60){const n=document.createElement('div');n.className='small mut';n.textContent='+'+(scan.products.length-60)+' … (CSV)';pg.appendChild(n)}
  $('costBox').classList.toggle('hidden',!scan.products.length&&!Object.keys(state.costs).length);
}
$('costImport').onclick=()=>{
  E.parseCSV($('costPaste').value).forEach(r=>{if(r.length>=2){const v=E.parseMoney(r[1]);if(v!==null)state.costs[r[0].trim()]=v}});save();buildSettings();$('costPaste').value='';
};
// ---- run + render
function run(){
  const S=JSON.parse(JSON.stringify(state.settings));
  const ck={};Object.keys(S.carrierCosts||{}).forEach(k=>ck[k]=S.carrierCosts[k]);S.carrierCosts=ck;
  S.maxOrders=(PRO||state.demo)?null:FREE_CAP;
  state.result=E.analyze(state.table,state.mapping,S,state.costs);render();
  $('report').classList.remove('hidden');$('report').scrollIntoView({behavior:'smooth'});
}
function kpi(l,v,cls){return `<div class="kpi ${cls||''}"><div class="v">${v}</div><div class="l">${l}</div></div>`}
function render(){
  const R=state.result,K=R.kpis,unlocked=PRO||state.demo;
  $('demoBanner').classList.toggle('hidden',!state.demo);
  $('kpis').innerHTML=kpi(t('kNet'),cur(K.netProfit),K.netProfit<0?'neg':'big')+kpi(t('kMargin'),fmt(K.margin*100,1)+'%',K.margin<0?'neg':'')+kpi(t('kRev'),cur(K.revenue))+kpi(t('kOrders'),fmt(K.orders,0))
   +kpi(t('kPer'),cur(K.profitPerOrder),K.profitPerOrder<0?'neg':'')+kpi(t('kFees'),cur(K.fees)+' <small>('+fmt(K.feePct*100,1)+'%)</small>')+kpi(t('kShip'),cur(K.shipping))+kpi(t('kCogs'),cur(K.cogs))
   +kpi(t('kRet'),fmt(K.returned,0))+(K.breakEvenRoas?kpi(t('kRoas'),fmt(K.breakEvenRoas,2)):'');
  let w='';(R.warnings||[]).forEach(x=>{w+='<div class="ins warn">'+t('w_'+x.key)(x)+'</div>'});
  if(R.excluded.cancelled||R.excluded.pending)w+='<div class="small mut">'+t('excluded')(R.excluded)+'</div>';$('warnBox').innerHTML=w;
  const rows=[['w_rev',K.revenue,'pos'],['w_cogs',-K.cogs,'cost'],['w_fees',-K.fees,'cost'],['w_cod',-K.codCosts,'cost'],['w_ship',-K.shipping,'cost'],['w_pack',-K.packaging,'cost'],['w_ads',-K.ads,'cost'],['w_fixed',-K.fixed,'cost'],['w_net',K.netProfit,K.netProfit<0?'neg':'pos']];
  const mx=Math.max(1,K.revenue);
  $('waterfall').innerHTML=rows.filter(r=>r[1]!==0||r[0]==='w_net').map(r=>`<div class="row" style="margin:5px 0"><div style="width:170px;font-size:13px">${t(r[0])}</div><div style="flex:1;min-width:120px"><div class="bar ${r[2]==='cost'?'cost':r[2]==='neg'?'neg':''}" style="width:${Math.max(1,Math.abs(r[1])/mx*100)}%"></div></div><div style="width:130px;text-align:end;font-weight:700">${cur(r[1])}</div></div>`).join('')+`<div class="small mut" style="margin-top:6px">${t('vatNote')}: ${cur(K.vat)}</div>`;
  $('insights').innerHTML=R.insights.map(i=>'<div class="ins">'+t('i_'+i.key)(i,M)+'</div>').join('')||'<div class="mut small">—</div>';
  $('assumps').innerHTML=R.assumptions.map(a=>'<div class="ins warn">'+t('a_'+a.key)(a,M)+'</div>').join('');
  $('tMethod').innerHTML='<tr><th>'+t('th_method')+'</th><th>'+t('th_orders')+'</th><th>'+t('th_gross')+'</th><th>'+t('th_fees')+'</th><th>'+t('th_eff')+'</th><th>'+t('th_ret')+'</th></tr>'+R.byMethod.map(m=>`<tr><td>${M(m.method)}</td><td>${m.orders}</td><td>${fmt(m.gross,0)}</td><td>${fmt(m.fees,0)}</td><td>${fmt(m.effFeePct*100,2)}%</td><td>${fmt(m.returnRate*100,1)}%</td></tr>`).join('');
  $('carrierCard').classList.toggle('hidden',!R.byCarrier.length);
  $('tCarrier').innerHTML='<tr><th>'+t('th_carrier')+'</th><th>'+t('th_orders')+'</th><th>'+t('th_ret')+'</th><th>'+t('th_ship')+'</th></tr>'+R.byCarrier.map(c=>`<tr><td>${esc(c.carrier)}</td><td>${c.orders}</td><td>${c.returned}</td><td>${fmt(c.shipping,0)}</td></tr>`).join('');
  $('tProduct').innerHTML='<tr><th>'+t('th_prod')+'</th><th>'+t('th_qty')+'</th><th>'+t('th_rev')+'</th><th>'+t('th_cogs')+'</th><th>'+t('th_other')+'</th><th>'+t('th_profit')+'</th></tr>'+R.byProduct.slice(0,60).map(p=>`<tr><td>${esc(p.product)}${p.costKnown?'':'<span class="chip">'+t('est')+'</span>'}</td><td>${p.qty}</td><td>${fmt(p.revenue,0)}</td><td>${fmt(p.cogs,0)}</td><td>${fmt(p.other,0)}</td><td class="${p.profit<0?'neg-t':'pos'}"><b>${fmt(p.profit,0)}</b></td></tr>`).join('');
  const d=R.byDay,mxd=Math.max(1,...d.map(x=>Math.abs(x.net)));
  $('dailyChart').innerHTML='<svg width="'+Math.max(600,d.length*14)+'" height="180" style="display:block">'+d.map((x,i)=>{const h=Math.abs(x.net)/mxd*70;const y=x.net>=0?90-h:90;return `<rect x="${i*14+4}" y="${y}" width="10" height="${Math.max(1,h)}" fill="${x.net>=0?'#0b7a5b':'#c0392b'}"><title>${x.date}: ${fmt(x.net,0)}</title></rect>`}).join('')+`<line x1="0" x2="${d.length*14+8}" y1="90" y2="90" stroke="#999"/><text x="4" y="176" font-size="11" fill="#666">${d.length?d[0].date:''}</text><text x="${d.length*14-70}" y="176" font-size="11" fill="#666">${d.length?d[d.length-1].date:''}</text></svg>`;
  ['gProducts','gDaily'].forEach(id=>$(id).classList.toggle('hidden',!unlocked));
  $('csvBtn').classList.toggle('hidden',!unlocked);$('printBtn').classList.toggle('hidden',!unlocked);
  $('upsell').classList.toggle('hidden',unlocked);
}
$('csvBtn').onclick=()=>{const R=state.result;const rows=[['order_id','date','status','payment','carrier','total','revenue_ex_vat','cogs','payment_fee','shipping','contribution']].concat(R.orders.map(o=>[o.id,o.date,o.status,o.method,o.carrier,o.total,o.revenueExVat,o.cogs,o.fee,o.shipping,o.contribution]));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([E.toCSV(rows)],{type:'text/csv;charset=utf-8'}));a.download='meezan-orders-profit.csv';a.click()};
$('printBtn').onclick=()=>window.print();
$('againBtn').onclick=()=>{state.table=null;$('stepSettings').classList.add('hidden');$('report').classList.add('hidden');$('mapBox').classList.add('hidden');$('fileMsg').textContent='';window.scrollTo({top:0,behavior:'smooth'})};
$('runBtn').onclick=run;
$('resetBtn').onclick=()=>{try{localStorage.removeItem('mz_settings')}catch(e){}state.settings=E.defaultSettings();state.costs={};if(state.table)buildSettings()};
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('mz_lang',lang)}catch(e){}applyLang()};
$('pickBtn').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])handleFile(e.target.files[0])};

// ---- demo data (deterministic)
function demoRaw(){
  let seed=28;const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
  const P=[['عطر عود ملكي 50مل','OUD-50',140],['عطر مسك أبيض 30مل','MSK-30',90],['بخور فاخر علبة','BKH-01',75],['مبخرة كهربائية','MBK-02',160],['طقم هدايا رمضان','GFT-RM',260],['دهن عود كلاسيك 3مل','DHN-03',310]];
  const MT=[['مدى',.38],['فيزا / ماستركارد',.16],['Apple Pay',.12],['تابي',.08],['تمارا',.07],['الدفع عند الاستلام',.17],['تحويل بنكي',.02]],ST=[['تم التنفيذ',.82],['قيد التنفيذ',.05],['ملغي',.05],['مسترجع',.07],['بانتظار الدفع',.01]],CR=['أرامكس','سمسا','ريدبوكس'];
  const pick=l=>{let r=rnd(),a=0;for(const [v,w] of l){a+=w;if(r<=a)return v}return l[l.length-1][0]};
  const rows=[['رقم الطلب','تاريخ الطلب','حالة الطلب','طريقة الدفع','شركة الشحن','المنتج','SKU','الكمية','سعر الوحدة','الخصم','شحن العميل','إجمالي الطلب']];
  for(let i=1;i<=320;i++){const day=1+Math.floor(rnd()*56),d=new Date(Date.UTC(2026,8,day)),ds=d.toISOString().slice(0,10);const n=1+Math.floor(rnd()*3),ls=[];for(let k=0;k<n;k++){const p=P[Math.floor(rnd()*P.length)];ls.push([p[0],p[1],1+(rnd()<.3?1:0),p[2]])}
    const sub=ls.reduce((a,l)=>a+l[2]*l[3],0),ship=sub<400&&rnd()<.5?25:0,disc=rnd()<.25?Math.round(sub*.1*100)/100:0,total=sub+ship-disc,m=pick(MT),s=pick(ST),c=CR[Math.floor(rnd()*3)];
    ls.forEach(l=>rows.push([String(100000+i),ds,s,m,c,l[0],l[1],l[2],l[3],disc,ship,total]))}
  return rows;
}

}
